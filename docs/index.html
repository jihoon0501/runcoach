<h1>RunCoach</h1>
<p>삼성 헬스의 러닝 기록과 수면·심박 같은 건강 신호를 함께 보고, 내 몸 상태에 맞는 훈련 계획과 피드백을 만들어 주는 안드로이드 러닝 코치 앱이에요.</p>
<ul><li>내 정보(키·체중·나이·목표)에 맞춘 심박 구간과 훈련 강도</li>

<p>내 정보와 건강 데이터는 폰 안에서만 저장·계산해요. 의료 기기가 아니며 일반적인 운동 가이드예요.</p>
